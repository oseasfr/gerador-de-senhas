<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="imagens/favicon.ico" type="image/x-icon">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="svg-background">
    <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lockGradient" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <circle cx="200" cy="100" r="85" fill="#1e293b" />
      <circle cx="200" cy="100" r="80" fill="#0f172a" />

      <rect x="165" y="90" width="70" height="60" rx="10" ry="10" fill="url(#lockGradient)" />
      <path d="M175 90 Q175 65 200 65 Q225 65 225 90" stroke="url(#lockGradient)" stroke-width="14" fill="none" stroke-linecap="round" />
      <circle cx="200" cy="115" r="8" fill="#0f172a" />
      <rect x="197" y="115" width="6" height="12" fill="#0f172a" />

      <g font-family="monospace" font-weight="bold" font-size="16" fill="white" text-anchor="middle" filter="url(#glow)">
        <text x="170" y="145">
          <tspan>A</tspan>
          <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" />
        </text>
        <text x="190" y="145">
          <tspan>b</tspan>
          <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" begin="0.3s" />
        </text>
        <text x="210" y="145">
          <tspan>3</tspan>
          <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" begin="0.6s" />
        </text>
        <text x="230" y="145">
          <tspan>@</tspan>
          <animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite" begin="0.9s" />
        </text>
      </g>

      <circle cx="200" cy="100" r="90" stroke="#3b82f6" stroke-width="1" fill="none">
        <animate attributeName="r" values="85;105;85" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
    </svg>
  </div>

  <div class="overlay">
    <div class="container">
      <h1>🔐 Gerador de Senhas</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="generate">Gerar Senha</button>
        <button class="tab-btn" data-tab="test">Testar Senha</button>
      </div>

      <div id="generate" class="tab-content active">
        <div class="options">
          <div class="length-option">
            <label for="passwordLength">Comprimento da senha: <span id="lengthValue">16</span></label>
            <div class="range-slider">
              <input type="range" id="passwordLengthSlider" min="12" max="32" value="16">
              <input type="number" id="passwordLength" min="12" max="32" value="16">
            </div>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeUpper" checked>
            <label for="includeUpper">Letras maiúsculas (A-Z)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeLower" checked>
            <label for="includeLower">Letras minúsculas (a-z)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeNumbers" checked>
            <label for="includeNumbers">Números (0-9)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeSymbols" checked>
            <label for="includeSymbols">Símbolos (!@#$%&*()-_=+)</label>
          </div>
        </div>

        <div class="password-container">
          <input type="text" id="password" readonly>
          <div class="copy-feedback">Copiado!</div>
        </div>

        <button onclick="gerarSenha()">Gerar nova senha</button>
        <button onclick="copiarSenha('password')">Copiar Senha</button>

        <div class="strength-meter">
          <div class="strength-title">
            <span>Força da senha: <span id="strength-text">-</span></span>
            <span id="strength-score">-</span>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-info" id="strength-info">-</div>
        </div>
      </div>

      <div id="test" class="tab-content">
        <h2>Digite uma senha para testar sua força</h2>

        <div class="password-container">
          <input type="text" id="testPassword" placeholder="Digite sua senha aqui">
        </div>
        <div class="strength-meter">
          <div class="strength-title">
            <span>Força da senha: <span id="test-strength-text">-</span></span>
            <span id="test-strength-score">-</span>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="test-strength-fill"></div>
          </div>
          <div class="strength-info" id="test-strength-info">Digite uma senha para avaliação.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  <script src="js/password-strength.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
