<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Novos estilos apenas para o SVG - não interfere no existente */
.svg-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.7;
      pointer-events: none;
      overflow: hidden;
    }
    
    .svg-background svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    /* Ajuste para o overlay */
    .overlay {
      position: relative;
      z-index: 1;
      background-color: rgba(15, 23, 42, 0.85);
    }
  </style>
</head>
<body>
  <!-- SVG como plano de fundo -->
  <div class="svg-background">
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <!-- [Todo o conteúdo do seu SVG aqui] -->
      <defs>
        <linearGradient id="lockGradient" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <!-- ... resto do código SVG ... -->
      </defs>
      <!-- ... elementos gráficos do SVG ... -->
    </svg>
  </div>

  <!-- Seu conteúdo original completo -->
  <div class="overlay">
    <!-- [Todo o seu conteúdo HTML original aqui] -->
    <div class="container">
      <!-- ... todo o conteúdo do gerador de senhas ... -->
    </div>
  </div>

  <script src="js/password-strength.js"></script>
  <script src="js/script.js"></script>
  </div>

  <!-- Seu conteúdo original COMPLETO (exatamente como estava) -->
  <div class="overlay">
    <div class="container">
      <h1>🔐 Gerador de Senhas</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="generate">Gerar Senha</button>
        <button class="tab-btn" data-tab="test">Testar Senha</button>
      </div>

      <div id="generate" class="tab-content active">
        <div class="options">
          <div class="length-option">
            <label for="passwordLength">Comprimento da senha: <span id="lengthValue">20</span></label>
            <div class="range-slider">
              <input type="range" id="passwordLengthSlider" min="10" max="20" value="20">
              <input type="number" id="passwordLength" min="10" max="20" value="20">
            </div>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeUpper" checked>
            <label for="includeUpper">Letras maiúsculas (A-Z)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeLower" checked>
            <label for="includeLower">Letras minúsculas (a-z)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeNumbers" checked>
            <label for="includeNumbers">Números (0-9)</label>
          </div>

          <div class="option-row">
            <input type="checkbox" id="includeSymbols" checked>
            <label for="includeSymbols">Símbolos (!@#$%&*()-_=+)</label>
          </div>
        </div>

        <div class="password-container">
          <input type="text" id="password" readonly>
          <div class="copy-feedback">Copiado!</div>
        </div>

        <button onclick="gerarSenha()">Gerar nova senha</button>
        <button onclick="copiarSenha('password')">Copiar Senha Gerada</button>

        <div class="strength-meter">
          <div class="strength-title">
            <span>Força da senha: <span id="strength-text">-</span></span>
            <span id="strength-score">-</span>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-info" id="strength-info">-</div>
        </div>
      </div>

      <div id="test" class="tab-content">
        <h2>Digite uma senha para testar sua força</h2>

        <div class="password-container">
          <input type="text" id="testPassword" placeholder="Digite sua senha aqui">
        </div>
        <div class="strength-meter">
          <div class="strength-title">
            <span>Força da senha: <span id="test-strength-text">-</span></span>
            <span id="test-strength-score">-</span>
          </div>
          <div class="strength-bar">
            <div class="strength-fill" id="test-strength-fill"></div>
          </div>
          <div class="strength-info" id="test-strength-info">-</div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/password-strength.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
