<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="https://raw.githubusercontent.com/oseasfr/gerador-de-senhas/refs/heads/Principal/imagens/favicon.ico" type="image/x-icon">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Estilos para o SVG de fundo */
    .svg-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0; /* Alterado para ficar abaixo do overlay */
      pointer-events: none;
      overflow: hidden;
    }
    
    /* Ajuste para o overlay ficar acima do SVG */
    .overlay {
      position: relative;
      z-index: 1;
      background-color: rgba(15, 23, 42, 0.85);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Estilo para complementar o body */
    body {
      background: url('imagens/001.jpg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
  </style>
</head>
<body>
    <div class="svg-background">
    <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lockGradient" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>

        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0f172a" />
          <stop offset="100%" stop-color="#1e293b" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="innerShadow">
          <feOffset dx="0" dy="3" />
          <feGaussianBlur stdDeviation="2" result="offset-blur" />
          <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
          <feFlood flood-color="black" flood-opacity="0.4" result="color" />
          <feComposite operator="in" in="color" in2="inverse" result="shadow" />
          <feComposite operator="over" in="shadow" in2="SourceGraphic" />
        </filter>

        <pattern id="gridPattern" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#0f172a" />
          <rect width="1" height="1" fill="#334155" />
        </pattern>
      </defs>

      <circle cx="200" cy="100" r="85" fill="#1e293b" />

      <circle cx="200" cy="100" r="75" fill="url(#gridPattern)" opacity="0.1">
        <animate attributeName="opacity" values="0.05;0.15;0.05" dur="3s" repeatCount="indefinite" />
      </circle>
