<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Senhas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: url('https://unsplash.com/pt-br/fotografias/closeup-photo-of-turned-on-blue-and-white-laptop-computer-iIJrUoeRoCQ') no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background-color: rgba(15, 23, 42, 0.85); /* overlay escuro */
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: rgba(30, 41, 59, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 400px;
      width: 90%;
      color: #f8fafc;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    #password {
      font-family: monospace;
      font-size: 1.1rem;
      background: #334155;
      color: #f1f5f9;
      padding: 10px;
      margin: 20px 0;
      border: none;
      border-radius: 8px;
      width: 100%;
      text-align: center;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <h1>🔐 Gerador de Senhas</h1>
      <input type="text" id="password" readonly />
      <button onclick="gerarSenha()">Gerar Senha</button>
    </div>
  </div>

  <script>
    function gerarSenha() {
      const length = 20;
      const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*()-_=+";
      let password = "";
      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(Math.random() * charset.length);
        password += charset[randomIndex];
      }
      document.getElementById("password").value = password;
    }

    window.onload = gerarSenha;
  </script>
</body>
</html>
